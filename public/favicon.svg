<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#35e37a" />
      <stop offset="60%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#128a3c" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1ed760" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer glowing brand circle -->
  <circle cx="50" cy="50" r="46" fill="url(#glow)" filter="url(#shadow)" />
  
  <!-- Inner dark core -->
  <circle cx="50" cy="50" r="38" fill="#070707" />
  
  <!-- Sleek neon green 'Z' soundwave monogram -->
  <path d="M30 32 H70 L38 68 H70" stroke="#1ed760" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Subtle center pulse dot -->
  <circle cx="50" cy="50" r="4.5" fill="#35e37a" />
</svg>
